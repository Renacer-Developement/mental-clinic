version: 2
updates:
  # pnpm workspace shares the root pnpm-lock.yaml, so one entry covers all apps.
  - package-ecosystem: "npm"
    directory: "/"
    # Every PR branch triggers a preview build in each Vercel project of the monorepo
    # (Hobby plan: 100 deployments/day), so updates come monthly and batched.
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 2
    groups:
      # All minor/patch bumps in one PR; majors still get their own PR to review.
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeng"
        update-types: ["version-update:semver-major"]
