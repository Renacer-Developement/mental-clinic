<section class="no-fear-section" aria-label="Чому не варто боятись психіатра">
  <div class="no-fear-inner">

    <div class="no-fear-aside">
      <div class="no-fear-sticky">
        <span class="no-fear-eyebrow">Без стигми</span>
        <h2 class="no-fear-heading">Чому не варто боятись психіатра</h2>
        <p class="no-fear-lead">Чотири факти, які варто знати перед першим візитом.</p>
      </div>
    </div>

    <ul class="fact-list">
      @for (fact of facts; track fact.title) {
        <li class="fact-card">
          <h3 class="fact-title">{{ fact.title }}</h3>
          <p class="fact-text">{{ fact.text }}</p>
        </li>
      }
    </ul>

  </div>
</section>
