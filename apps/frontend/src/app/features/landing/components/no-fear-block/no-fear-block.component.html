<section class="no-fear-section" aria-label="Чому не варто боятись психіатра">
  <div class="no-fear-inner">

    <div class="no-fear-aside">
      <div class="no-fear-sticky">
        <span class="no-fear-eyebrow">Без стигми</span>
        <h2 class="no-fear-heading">Чому не варто боятись психіатра</h2>
        <p class="no-fear-lead">Чотири факти, які варто знати перед першим візитом.</p>
      </div>
    </div>

    <ul class="fact-list">
      @for (fact of facts; track fact.title; let i = $index) {
        <!-- Phones: an accordion (one fact open at a time); wider screens show every text -->
        <li class="fact-card" [class.is-open]="openFact() === i">
          <h3 class="fact-title">
            <button class="fact-toggle" type="button" (click)="toggle(i)"
                    [attr.aria-expanded]="openFact() === i" [attr.aria-controls]="'fact-text-' + i">
              {{ fact.title }}
              <span class="fact-chevron" aria-hidden="true"></span>
            </button>
          </h3>
          <p class="fact-text" [id]="'fact-text-' + i">{{ fact.text }}</p>
        </li>
      }
    </ul>

  </div>
</section>
