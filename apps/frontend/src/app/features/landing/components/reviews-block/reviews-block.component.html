@if (reviews().length) {
<section class="reviews-block">
  <div class="reviews-block__inner">

    <header class="rb-head">
      <div>
        <h2 class="rb-head__title">Що кажуть пацієнти</h2>
      </div>
      <a class="rb-head__all" [routerLink]="'/' + ROUTES.REVIEWS">
        Всі відгуки
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>
        </svg>
      </a>
    </header>

    <p-carousel
      [value]="reviews()"
      [numVisible]="3"
      [numScroll]="1"
      [circular]="true"
      [showIndicators]="true"
      [responsiveOptions]="carouselOptions"
      styleClass="reviews-block__carousel"
      [prevButtonProps]="navButtonProps"
      [nextButtonProps]="navButtonProps"
    >
      <ng-template let-review pTemplate="item">
        <div class="rb-slide">
          <figure class="rb-card">
            <span class="rb-card__quote" aria-hidden="true">“</span>
            <blockquote class="rb-card__text">{{ review.text }}</blockquote>
            <figcaption class="rb-card__author">
              @if (review.photo) {
                <div class="rb-card__avatar">
                  <img [src]="review.photo" [alt]="review.name" loading="lazy" />
                </div>
              }
              <div class="rb-card__meta">
                <span class="rb-card__name">{{ review.name }}</span>
                @if (review.role) {
                  <span class="rb-card__role">{{ review.role }}</span>
                }
              </div>
            </figcaption>
          </figure>
        </div>
      </ng-template>
    </p-carousel>

    <!-- phones: the "all reviews" link moves under the slider as a full-width button -->
    <a class="rb-foot" [routerLink]="'/' + ROUTES.REVIEWS">
      Читати всі відгуки
      @if (total()) { <span class="rb-foot__count">{{ total() }}</span> }
    </a>

  </div>
</section>
}
