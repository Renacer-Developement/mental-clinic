<div class="test-block">
  <ol class="test-index">
    @for (card of mentalCards; track card.link) {
      <li class="test-row">
        <a
          class="test-row__link"
          [routerLink]="[TEST_ROUTES.LIST, card.link]"
          (click)="googleAnalyticsTracker(EVENT_TRACK.CARD_CLICK, card.title, ROUTES.MAIN_PAGE)"
        >
          <span class="test-row__line" aria-hidden="true"></span>
          <h3 class="test-row__title"><span class="test-row__title-inner">{{ card.title }}</span></h3>
          <p class="test-row__desc">{{ card.description }}</p>
          <span class="test-row__go">
            <span class="test-row__go-label">Пройти тест</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </span>
        </a>
      </li>
    }
  </ol>

  <p class="cards-disclaimer">
    Тести не є медичним діагнозом — це лише можливість перевірити свої симптоми перед візитом до психіатра.
  </p>
</div>
