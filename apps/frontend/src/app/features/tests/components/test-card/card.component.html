<article class="tcard">
  <h4 class="tcard__title">{{ testData?.name }}</h4>
  <p class="tcard__desc">{{ testData?.description }}</p>

  <div class="tcard__actions">
    <button class="tcard__cta" type="button" (click)="redirectToTest(testData?._id)">Пройти тест</button>
    <button class="tcard__share" type="button" (click)="share()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      {{ copied() ? 'Скопійовано' : 'Поділитися' }}
    </button>
  </div>

  @if (testData?.questionCount ?? testData?.questions?.length; as count) {
    <span class="tcard__count">{{ count }} питань</span>
  }
</article>
