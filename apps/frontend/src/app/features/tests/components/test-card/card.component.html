<!-- One test as an index row: what it is, how long, take it -->
<article class="trow">
  <div class="trow__main">
    <h4 class="trow__title">
      <a [routerLink]="['/test/detail', testKey(testData)]" (click)="trackSelect(testData?._id)">{{ testData?.name }}</a>
    </h4>
    @if (testData?.description) {
      <p class="trow__desc">{{ testData.description }}</p>
    }
  </div>

  <div class="trow__side">
    @if (testData?.duration) {
      <span class="trow__time"><i class="pi pi-clock" aria-hidden="true"></i>{{ testData.duration }}</span>
    }
    <button class="trow__share" type="button" (click)="share()" [attr.aria-label]="copied() ? 'Посилання скопійовано' : 'Поділитися тестом'">
      <i class="pi" [class.pi-share-alt]="!copied()" [class.pi-check]="copied()" aria-hidden="true"></i>
    </button>
    <a class="trow__cta" [routerLink]="['/test/detail', testKey(testData)]" (click)="trackSelect(testData?._id)" tabindex="-1" aria-hidden="true">Пройти тест <span>→</span></a>
  </div>
</article>
