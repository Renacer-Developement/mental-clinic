<ng-container *ngIf="visible">

  <div class="cc-backdrop" (click)="close()"></div>

  <div class="cc-modal" role="dialog" aria-modal="true" aria-labelledby="cc-title">

    <div class="cc-header">
      <div>
        <h2 class="cc-header__title" id="cc-title">Записатися на консультацію</h2>
        <p class="cc-header__sub">Напишіть або зателефонуйте — адміністратор підбере зручний час.</p>
      </div>
      <button class="cc-close" type="button" (click)="close()" aria-label="Закрити">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="cc-body">
      <ng-container *ngIf="contacts$ | async as contacts">
        <div *ngFor="let contact of contacts | keyvalue" class="cc-contact">

          <div class="cc-contact__head">
            <span class="cc-contact__label">Запис до {{ contact.value.name }}</span>
            <a class="cc-contact__phone" [href]="'tel:' + contact.value.phone" (click)="trackLead('phone')">{{ formatPhone(contact.value.phone) }}</a>
          </div>

          <div class="cc-contact__btns">
            <button class="cc-btn cc-btn--primary" type="button" (click)="openTelegram(contact.value.phone)">
              <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0
                         12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506
                         0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499
                         1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78
                         -.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174
                         -.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008
                         -1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663
                         3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
              </svg>
              Telegram
            </button>
            <button class="cc-btn" type="button" (click)="openViber(contact.value.phone)">
              <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                <path d="M11.4 0C5.7.3 1 4.6.1 10.2c-.5 3-.2 5.8 1 8.4.2.4.3.8.2 1.2l-.8 3.8c-.1.4.3.8.7.7l3.9-.9c.3-.1.7 0 1 .2 2 1 4.3 1.5 6.7 1.4C19 24.5 24 19.2 24 12.6 24 5.5 18.3-.3 11.4 0zm5 15.6c-.3.8-.9 1.3-1.7 1.5-.5.1-.9.1-1.4-.1-1.4-.5-2.7-1.3-3.8-2.3C8.4 13.6 7.5 12.2 7 10.7c-.3-.8-.4-1.6-.1-2.4.2-.6.6-1.1 1.1-1.4.4-.2.8-.2 1.2 0 .2.1.4.3.5.5l.9 1.5c.1.2.2.4.1.7-.1.2-.2.3-.3.5l-.4.4c-.1.1-.2.3-.1.4.4.8 1 1.5 1.6 2.1.7.6 1.4 1.1 2.3 1.4.2.1.4 0 .5-.2l.4-.5c.1-.2.3-.4.6-.4.2 0 .4.1.6.2l1.5 1c.3.2.4.4.5.7.1.3.1.5-.1.9z"/>
              </svg>
              Viber
            </button>
            <a class="cc-btn" [href]="'tel:' + contact.value.phone" (click)="trackLead('phone')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.86a16 16 0 0 0 6 6l.86-.86a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.6 16.92z"/>
              </svg>
              Подзвонити
            </a>
          </div>
        </div>
      </ng-container>
    </div>

    <p class="cc-footer">Запис щодня з 8:00 до 22:00</p>
  </div>

</ng-container>
