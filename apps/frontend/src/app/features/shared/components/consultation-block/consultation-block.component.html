<section class="consultation-section">
  <div class="consultation-inner">

    <header class="consultation-header">
      <div>
        <span class="consultation-eyebrow">Як записатися</span>
        <h2 class="consultation-title">Три кроки до вашої консультації</h2>
      </div>
      <a class="consultation-cta" href="/visit">
        Записатися на прийом
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="7" y1="17" x2="17" y2="7"/>
          <polyline points="7 7 17 7 17 17"/>
        </svg>
      </a>
    </header>

    <div class="timeline">
      <span class="timeline__track" aria-hidden="true"></span>
      <span class="timeline__progress" aria-hidden="true"></span>

      <ol class="steps">
        @for (step of steps; track step.title; let i = $index) {
          <li class="step">
            <span class="step__num" aria-hidden="true">{{ (i + 1).toString().padStart(2, '0') }}</span>
            <span class="step__dot" aria-hidden="true"></span>
            <h3 class="step__title">{{ step.title }}</h3>
            <p class="step__desc">{{ step.description }}</p>
          </li>
        }
      </ol>
    </div>

  </div>
</section>
