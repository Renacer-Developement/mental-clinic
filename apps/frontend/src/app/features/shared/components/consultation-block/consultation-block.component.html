<section class="consultation-section">
  <div class="consultation-inner">

    <header class="consultation-header">
      <span class="consultation-eyebrow">Як записатися</span>
      <h2 class="consultation-title">Три кроки до вашої консультації</h2>
    </header>

    <div class="steps-grid">
      <article class="step" *ngFor="let step of steps; let i = index; let last = last">

        <div class="step-top">
          <span class="step-num">{{ i + 1 }}</span>
          <div class="step-connector" *ngIf="!last"></div>
        </div>

        <div class="step-icon-wrap">
          <ng-container [ngSwitch]="step.icon">

            <!-- chat -->
            <svg *ngSwitchCase="'chat'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>

            <!-- person with check -->
            <svg *ngSwitchCase="'person'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <polyline points="16 11 18 13 22 9"/>
            </svg>

            <!-- calendar -->
            <svg *ngSwitchCase="'calendar'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
              <circle cx="9" cy="16" r="0.8" fill="currentColor" stroke="none"/>
              <circle cx="15" cy="16" r="0.8" fill="currentColor" stroke="none"/>
            </svg>

          </ng-container>
        </div>

        <h3 class="step-title">{{ step.title }}</h3>
        <p class="step-desc">{{ step.description }}</p>

      </article>
    </div>

  </div>
</section>
