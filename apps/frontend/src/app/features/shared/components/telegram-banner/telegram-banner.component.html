<section class="tg-section">
  <div class="tg-container">

    <div class="tg-content">
      <span class="tg-eyebrow">Telegram</span>
      <h2 class="tg-heading">Доєднуйся до нашої телеграм спільноти</h2>
      <p class="tg-subheading">
        Ставте питання доказовим психіатрам і психологам — і отримуйте відповіді у зручному форматі
      </p>
    </div>

    <div class="tg-actions">
      @for (chat of chats; track chat.link) {
        <button type="button" class="tg-link" (click)="openTelegram(chat.name, chat.link)">
          <span class="tg-link__line" aria-hidden="true"></span>
          <span class="tg-link__label">{{ chat.name }}</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/>
          </svg>
        </button>
      }
    </div>

  </div>
</section>
