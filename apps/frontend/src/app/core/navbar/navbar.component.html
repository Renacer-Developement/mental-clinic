<header class="navbar">
    <div class="navbar__brand">
        <img
                (click)="redirectToMainPage()"
                alt="Логотип центру ментального здоров'я Євгена Скрипника"
                class="navbar__logo"
                src="../../../assets/logo-icon.avif"
        />
        <div class="flex flex-column logo-color">
            <small>Онлайн центр ментального здоров`я</small>
            <small>Євгена Скрипника</small>
        </div>
    </div>

    <nav [class.active]="isMenuOpen" aria-label="Main Navigation" class="navbar__menu">

        <div class="navbar__menu-header">
            <div class="navbar__menu-brand">
                <div class="navbar__menu-brand-dot"></div>
                <span>Навігація</span>
            </div>
            <button class="navbar__menu-close" (click)="toggleMenu()" aria-label="Закрити меню">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <ul>
            <li>
                <a [href]="TEST_ROUTES.LIST"
                   (click)="navigateTo(TEST_ROUTES.LIST, 'Тести')"
                   title="Тести">
                    <span class="nav-link__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                            <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
                            <rect x="9" y="3" width="6" height="4" rx="2"/>
                            <line x1="9" y1="12" x2="15" y2="12"/>
                            <line x1="9" y1="16" x2="13" y2="16"/>
                        </svg>
                    </span>
                    <span class="nav-link__label">Тести</span>
                    <span class="nav-link__arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </span>
                </a>
            </li>
            <li>
                <a [href]="ROUTES.DRUGS"
                   (click)="navigateTo(ROUTES.DRUGS, 'Перевірка ліків')"
                   title="Перевірка ліків">
                    <span class="nav-link__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                        </svg>
                    </span>
                    <span class="nav-link__label">Перевірка ліків</span>
                    <span class="nav-link__arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </span>
                </a>
            </li>
            <li>
                <a [href]="ROUTES.ABOUT"
                   (click)="navigateTo(ROUTES.ABOUT, 'Про лікаря')"
                   title="Про лікаря">
                    <span class="nav-link__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <span class="nav-link__label">Про лікаря</span>
                    <span class="nav-link__arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </span>
                </a>
            </li>
            <li>
                <a [href]="ROUTES.ARTICLES"
                   (click)="navigateTo(ROUTES.ARTICLES, 'Статті')"
                   title="Статті">
                    <span class="nav-link__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                    </span>
                    <span class="nav-link__label">Статті</span>
                    <span class="nav-link__arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </span>
                </a>
            </li>
            <li>
                <a [href]="ROUTES.REVIEWS"
                   (click)="navigateTo(ROUTES.REVIEWS, 'Відгуки')"
                   title="Відгуки">
                    <span class="nav-link__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                             stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </span>
                    <span class="nav-link__label">Відгуки</span>
                    <span class="nav-link__arrow">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </span>
                </a>
            </li>
        </ul>

        <div class="navbar__menu-footer">
            <p-button
                    (click)="openContacts()"
                    title="Зв'язатися з нами"
                    styleClass="menu-cta-btn"
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="margin-right:6px">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.86a16 16 0 0 0 6 6l.86-.86a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.6 16.92z"/>
                </svg>
                Онлайн запис
            </p-button>
        </div>

    </nav>

    <button
            (click)="toggleMenu()"
            [class.active]="isMenuOpen"
            aria-label="Toggle Navigation"
            class="navbar__toggle"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>

<div
        (click)="toggleMenu()"
        [class.active]="isMenuOpen"
        class="navbar-overlay"
></div>
